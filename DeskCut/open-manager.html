<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Management Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 24px;
            width: 100%;
            max-width: 480px;
            padding: 24px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 24px 32px;
            font-family: inherit;
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            color: #ffffff;
            background-color: #45cbbf;
            border: none;
            border-radius: 16px;
            text-decoration: none;
            cursor: pointer;
            box-shadow: 0 10px 25px -5px rgba(69, 203, 191, 0.4);
            transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
            text-align: center;
        }

        .btn:hover {
            background-color: #3bb5aa;
            transform: translateY(-2px);
            box-shadow: 0 15px 30px -5px rgba(69, 203, 191, 0.6);
        }

        .btn:active {
            transform: translateY(0);
            box-shadow: 0 5px 15px -5px rgba(69, 203, 191, 0.4);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Button 1: Custom protocol link -->
        <a href="openhp:///" class="btn">
            OPEN DEVICE MANAGEMENT
        </a>

        <!-- Button 2: Closes the current tab -->
        <button type="button" class="btn" onclick="closeTab()">
            RETURN TO HOME
        </button>
    </div>

    <script>
        function closeTab() {
            window.close();
            
            // Fallback: If the browser blocks closing the tab, 
            // redirect to your home page instead as a safety net.
            setTimeout(function() {
                window.location.href = "https://sites.google.com/view/deskcut/";
            }, 200);
        }
    </script>

</body>
</html>
