<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Print Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f4f7f6;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 24px;
            width: 100%;
            max-width: 480px;
            padding: 24px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 32px;
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            color: #003829; /* Dark mint text for contrast */
            background-color: #98ff98; /* Mint green */
            border: none;
            border-radius: 16px;
            text-decoration: none;
            cursor: pointer;
            box-shadow: 0 10px 25px -5px rgba(152, 255, 152, 0.4);
            transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
            text-align: center;
        }

        .btn:hover {
            background-color: #83f383;
            transform: translateY(-2px);
            box-shadow: 0 15px 30px -5px rgba(152, 255, 152, 0.6);
        }

        .btn:active {
            transform: translateY(0);
            box-shadow: 0 5px 15px -5px rgba(152, 255, 152, 0.4);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Button 1: Custom protocol link -->
        <a href="openprinter:///" class="btn">
            OPEN PRINT JOBS
        </a>

        <!-- Button 2: Direct link to home page -->
        <a href="https://sites.google.com/view/deskcut/" class="btn">
            RETURN TO HOME
        </a>
    </div>

</body>
</html>
