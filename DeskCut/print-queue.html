<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Print Dashboard</title>
    <style>
        .container {
            display: flex;
            flex-direction: column;
            gap: 24px;
            width: 100%;
            max-width: 480px;
            padding: 24px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 32px;
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            color: #003829;
            background-color: #98ff98;
            border: none;
            border-radius: 16px;
            text-decoration: none;
            cursor: pointer;
            box-shadow: 0 10px 25px -5px rgba(152, 255, 152, 0.4);
            transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
            text-align: center;
            width: 100%;
        }

        .btn:hover {
            background-color: #83f383;
            transform: translateY(-2px);
            box-shadow: 0 15px 30px -5px rgba(152, 255, 152, 0.6);
        }

        .btn:active {
            transform: translateY(0);
            box-shadow: 0 5px 15px -5px rgba(152, 255, 152, 0.4);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Button 1: Custom protocol link -->
        <a href="openprinter:///" class="btn">
            OPEN PRINT JOBS
        </a>

        <!-- Button 2: Closes the current tab -->
        <button type="button" class="btn" onclick="closeTab()">
            RETURN TO HOME
        </button>
    </div>

    <script>
        function closeTab() {
            window.close();
            
            // Fallback: If the browser blocks closing the tab, 
            // redirect to your home page instead as a safety net.
            setTimeout(function() {
                window.location.href = "https://sites.google.com/view/deskcut/";
            }, 200);
        }
    </script>

</body>
</html>
